name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=24.10
            type=ref,event=tag
            type=sha

      - name: Build and load image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          image=ghcr.io/${{ github.repository }}:24.10
          # Isolated bridge network so OpenWrt's firewall stays inside the
          # container and never touches the runner. Probe LuCI over the
          # container's own loopback via `docker exec`.
          docker run -d -t --name smoke --privileged "$image"
          ok=
          for i in $(seq 1 20); do
            if docker exec smoke wget -q -O /dev/null http://127.0.0.1/ 2>/dev/null; then
              ok=1
              echo "attempt $i: LuCI responded"
              break
            fi
            echo "attempt $i: not ready"
            sleep 3
          done
          echo "--- container logs ---"
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
          if [ -z "$ok" ]; then
            echo "LuCI did not respond on http://127.0.0.1/"
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done
