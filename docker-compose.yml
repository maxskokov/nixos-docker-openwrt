services:
  openwrt-router:
    image: ghcr.io/maxskokov/nixos-docker-openwrt:24.10
    build: .
    container_name: devops-router
    network_mode: host
    privileged: true
    tty: true
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Untested starting point for dropping `privileged`. procd/netifd may still
    # need more (netlink, /dev access), so verify before relying on it.
    # privileged: false
    # cap_add:
    #   - NET_ADMIN
    #   - NET_RAW
